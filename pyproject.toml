[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascthem-agent-service"
version = "0.1.0"
description = "AscThem medication intelligence agent service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "langgraph>=1.0,<2.0",
  "langsmith>=0.12,<1.0",
  "openai>=3.7,<4.0",
  "pydantic>=2.11,<3.0",
  "python-dotenv>=1.1,<2.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<10.0",
  "pytest-asyncio>=1.1,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
